apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-agent
  namespace: online-boutique
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-agent-readonly
  namespace: online-boutique
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-agent-readonly
  namespace: online-boutique
subjects:
  - kind: ServiceAccount
    name: incident-agent
    namespace: online-boutique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-agent-readonly
